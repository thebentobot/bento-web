name: Release Please

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            - name: Release Please
              uses: googleapis/release-please-action@v5
              id: release
              with:
                  release-type: node
                  # Release PRs opened with the default GITHUB_TOKEN trigger CI in
                  # an "action_required" state, which needs a manual approval click
                  # before checks can run. A PAT makes the release PR a normal
                  # first-party PR so CI runs automatically. Falls back to
                  # GITHUB_TOKEN if the secret has not been configured yet.
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

    deploy:
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest
        name: Deploy to Production
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "26.13.0"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Deploy to Production
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --name bento-web
